<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fix LinkedIn Layout</title>
    <style>
      :root { color-scheme: light dark; --accent: #0a66c2; }
      body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 290px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
      input[type='number'] { width: 70px; }
      input[type='checkbox'] { accent-color: var(--accent); }
      .hint { color: GrayText; font-size: 11px; margin: -2px 0 6px; }
      hr { border: 0; border-top: 1px solid color-mix(in srgb, GrayText 30%, transparent); margin: 10px 0; }
      button { width: 100%; padding: 6px; cursor: pointer; }
      #status { min-height: 16px; font-size: 11px; color: GrayText; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Fix LinkedIn Layout</h1>
    <label>Enabled <input type="checkbox" id="enabled" /></label>
    <label>Apply from width (px) <input type="number" id="minWidth" min="800" step="20" /></label>
    <hr />
    <label>Dock messaging sidebar <input type="checkbox" id="dockMessaging" /></label>
    <label>Dock from width (px) <input type="number" id="dockMinWidth" min="800" step="20" /></label>
    <label>Auto-open messaging <input type="checkbox" id="autoOpenMessaging" /></label>
    <p class="hint">Opens the messaging panel on load. If you minimize it, it stays minimized.</p>
    <hr />
    <label>Debug outlines <input type="checkbox" id="debug" /></label>
    <button id="diag">Copy diagnostics</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
