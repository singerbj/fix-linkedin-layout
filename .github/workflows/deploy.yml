name: Build extension and deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/extension/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@fix-linkedin-layout/web --filter=@fix-linkedin-layout/extension
      # Ship the latest extension build alongside the site at a stable URL.
      - name: Package extension
        working-directory: apps/extension/dist
        run: zip -r ../../web/dist/fix-linkedin-layout.zip .
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
